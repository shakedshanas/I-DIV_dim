# Python environment used for all Python scripts and notebooks of this repository.
# Versions are the ones the analysis was run with.
# Create it with:  conda env create -f environment.yml  &&  conda activate isoform_div
name: isoform_div
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.2
  - pandas=2.2.2
  - numpy=1.26.4
  - scipy=1.13.0
  - scikit-learn=1.3.0
  - statsmodels=0.14.1
  - matplotlib=3.8.4
  - matplotlib-venn=1.1.2
  - seaborn=0.13.2
  - plotly=6.8.0
  - gseapy=1.1.4
  - jupyter=1.0.0
  - nbconvert=7.16.4
  - ipykernel=6.29.3
  - pip
  - pip:
      - gffpandas==1.2.0
      - tqdm==4.66.5
      - isoplex==0.1.0
